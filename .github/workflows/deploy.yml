name: Deploy Naive Art Sculpture Gallery to AWS Free Tier

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  STACK_NAME: naive-sculpture-gallery
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test-and-verify:
    name: Backend Tests & Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies & test
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          PYTHONPATH=. pytest -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy-aws:
    name: Deploy Serverless Stack (SAM + CloudFront)
    needs: test-and-verify
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build SAM application
        run: |
          cd infra
          sam build --use-container

      - name: Deploy SAM Stack
        run: |
          cd infra
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment="prod" \
              ArtistNotificationEmail="${{ secrets.ARTIST_NOTIFICATION_EMAIL || 'artist@naive-sculptures.art' }}" \
            --resolve-s3 \
            --no-confirm-changeset

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Sync Static Assets to S3 & Invalidate CloudFront CDN
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='GalleryBucketName'].OutputValue" \
            --output text)

          DIST_ID=$(aws cloudformation describe-stack-resources \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "StackResources[?ResourceType=='AWS::CloudFront::Distribution'].PhysicalResourceId" \
            --output text)

          echo "Target S3 Bucket: $BUCKET_NAME"
          echo "Target CloudFront Distribution: $DIST_ID"

          # Upload static assets with 1-year immutable caching
          aws s3 sync frontend/dist s3://$BUCKET_NAME --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # Upload index.html with no-cache so users always receive fresh HTML
          aws s3 cp frontend/dist/index.html s3://$BUCKET_NAME/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          # Invalidate CloudFront cache for instant release
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --paths "/*"

      - name: Deployment Summary
        run: |
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
            --output text)
          echo "=========================================================="
          echo "🚀 Naive Sculpture Gallery is LIVE!"
          echo "🔗 URL: $CLOUDFRONT_URL"
          echo "=========================================================="
