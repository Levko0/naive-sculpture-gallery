name: CI & Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  STACK_NAME: naive-sculpture-gallery
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test-and-verify:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install backend dependencies & run tests
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          PYTHONPATH=. pytest -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & build bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy-aws:
    name: Deploy to AWS Free Tier
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check AWS Secrets Availability
        id: check_aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_KEY" ]; then
            echo "has_aws=false" >> $GITHUB_OUTPUT
            echo "::notice::AWS_ACCESS_KEY_ID is not configured in GitHub Repository Secrets. Skipping AWS cloud deployment step."
          else
            echo "has_aws=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup AWS Credentials
        if: steps.check_aws.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup AWS SAM CLI
        if: steps.check_aws.outputs.has_aws == 'true'
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build SAM application
        if: steps.check_aws.outputs.has_aws == 'true'
        run: |
          cd infra
          sam build --use-container

      - name: Deploy SAM Stack
        if: steps.check_aws.outputs.has_aws == 'true'
        run: |
          cd infra
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment="prod" \
              ArtistNotificationEmail="${{ secrets.ARTIST_NOTIFICATION_EMAIL || 'artist@naive-sculptures.art' }}" \
            --resolve-s3 \
            --no-confirm-changeset

      - name: Download frontend dist artifact
        if: steps.check_aws.outputs.has_aws == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Sync Static Assets to S3 & Invalidate CloudFront CDN
        if: steps.check_aws.outputs.has_aws == 'true'
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='GalleryBucketName'].OutputValue" \
            --output text)

          DIST_ID=$(aws cloudformation describe-stack-resources \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "StackResources[?ResourceType=='AWS::CloudFront::Distribution'].PhysicalResourceId" \
            --output text)

          echo "Target S3 Bucket: $BUCKET_NAME"
          echo "Target CloudFront Distribution: $DIST_ID"

          aws s3 sync frontend/dist s3://$BUCKET_NAME --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp frontend/dist/index.html s3://$BUCKET_NAME/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --paths "/*"
